name: Check

# Static checks and linting for the LavaMoat documentation site.
# This is the main test workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/.github/actions/prepare
      - name: Build
        run: npm run build
      - parallel:
          - name: Astro Check
            run: npm run check
          - name: TypeScript
            run: npm run tsc
          - name: ESLint
            run: npm run lint:eslint
          - name: Spelling
            run: npm run lint:spelling
          - name: Markdown
            run: npm run lint:markdown
          - name: Prettier
            run: npm run format:check
          - name: zizmor
            # `advanced-security: true` would upload SARIF to GitHub Code
            # Scanning, which requires Advanced Security to be enabled on the
            # repository and `security-events: write` on this job. Until that
            # is set up, emit inline PR annotations instead.
            uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
            with:
              persona: pedantic
              min-severity: medium
              advanced-security: 'false'
              annotations: 'true'
